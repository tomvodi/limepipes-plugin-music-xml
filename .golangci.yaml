run:
  tests: true

linters:
  enable:
    - revive
    - ireturn

issues:
  exclude-files:
    - ".*_enumer\\.go$"  # generated by enumer
  exclude-rules:
    - linters:
        - revive
      source: ". \"github.com/onsi/(ginkgo/v2|gomega)\""
      text: "dot-imports: should not use dot imports"

    # Constructors returning an interface are the pattern the whole plugin is
    # built on: the expanders and the plugin itself are only ever used through
    # their interface.
    - linters:
        - ireturn
      path: "internal/(musicmodel/expander|pluginimplementation)/.*\\.go$"

    # An embellishment expander is a flat table of pitch rules: long, but a list
    # rather than a tangle. Breaking one up would hide the pattern it encodes,
    # so the complexity limit is not applied to them.
    - linters:
        - revive
      path: "internal/musicmodel/expander/.*\\.go$"
      text: "cognitive-complexity"

linters-settings:
  revive:
    enable-all-rules: false
    ignore-generated-header: false
    severity: error
    confidence: 0.8
    rules:
      - name: argument-limit
        arguments: [4]
      - name: blank-imports
      - name: cognitive-complexity
        arguments: [10]
        exclude:
          - "TEST"
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: early-return
      - name: empty-block
      - name: empty-lines
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: errorf
      - name: exported
      - name: function-result-limit
        arguments: [3]
      - name: import-shadowing
      - name: increment-decrement
      - name: indent-error-flow
      - name: max-control-nesting
        arguments: [3]
      - name: modifies-parameter
      - name: package-comments
        severity: warning
      - name: range
      - name: receiver-naming
      - name: redefines-builtin-id
      - name: struct-tag
      - name: superfluous-else
      - name: time-equal
      - name: time-naming
      - name: unexported-return
      - name: unhandled-error
      - name: unreachable-code
      - name: unused-parameter
      - name: use-any
      - name: var-declaration
      - name: var-naming
